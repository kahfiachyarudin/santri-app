<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Primary Brand Gradient (Emerald Green) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Accent Gradient (Teal/Cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Card Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Management Ring / Circuit Node (Simbol Data & Sistem) -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12" />
  
  <g filter="url(#glow)">
    <!-- Data Connection Nodes -->
    <circle cx="256" cy="90" r="10" fill="#10b981" />
    <circle cx="396" cy="230" r="10" fill="#06b6d4" />
    <circle cx="116" cy="230" r="10" fill="#06b6d4" />
    
    <!-- Open Book Base (Representasi Santri / Kitab / Ilmu) -->
    <!-- Left Page -->
    <path d="M 256 280 Q 190 250 130 270 L 130 180 Q 190 160 256 190 Z" 
          fill="url(#primaryGrad)" />
    <!-- Right Page -->
    <path d="M 256 280 Q 322 250 382 270 L 382 180 Q 322 160 256 190 Z" 
          fill="url(#accentGrad)" />
    
    <!-- Book Spine Glow / Center -->
    <path d="M 256 190 L 256 280" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Management / Analytics Bars Rising from Book (Representasi Manajemen Data) -->
    <rect x="185" y="190" width="18" height="40" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="215" y="160" width="18" height="70" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="245" y="130" width="22" height="100" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="279" y="150" width="18" height="80" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="309" y="175" width="18" height="55" rx="4" fill="#ffffff" opacity="0.9" />

    <!-- Crescent Moon / Kubah Aksen Halus di Puncak -->
    <path d="M 256 70 A 20 20 0 1 0 276 90 A 16 16 0 1 1 256 70 Z" fill="#f59e0b" />
  </g>

  <!-- Typography: SantriApp -->
  <text x="256" y="385" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="42" 
        font-weight="800" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="1.5">
    SANTRI<tspan fill="#10b981">APP</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="500" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="3">
    DATA MANAGEMENT SYSTEM
  </text>
</svg>
